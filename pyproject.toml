[project]
name = "mcp-toolbox"
version = "0.1.0"
description = "Small, tested MCP server: search and read official BOE documents over a bundled offline corpus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "jorgitobg" }]
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
mcp-toolbox = "mcp_toolbox.server:main"
mcp-toolbox-demo = "mcp_toolbox.demo:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "-q --cov=mcp_toolbox --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
